<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- CSP：只允許連到 GitHub API、Gist 原始檔、Gemini API（SPEC v2 第 5 節）。因此不載入 Google Fonts，字型用系統字。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com https://gist.githubusercontent.com https://generativelanguage.googleapis.com; font-src 'self' data:">
<title>Daily English Coach</title>
<meta name="theme-color" content="#0A776F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Layout: one centered column (max 720px) of stacked cards, a fixed bottom tab bar; the streak flame and the signal-bird mascot are the only loud elements. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF4; --ink:#17203A; --muted:#56617D; --line:#D3D9E6;
  --accent:#0A776F; --accent-ink:#FFFFFF; --accent-soft:#D2EDEA;
  --flame:#C9561A; --flame-soft:#FBE4D4;
  --ok:#1D7F46; --ok-soft:#DDF3E5; --bad:#B3392F; --bad-soft:#F9E0DE; --warn:#8A5B00; --warn-soft:#FBEFD2;
  --f-display:"Bricolage Grotesque","Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --f-zh:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#171F31; --surface-2:#212A40; --ink:#E6EBF5; --muted:#9BA6BF; --line:#2D3750;
    --accent:#43C3B7; --accent-ink:#04201D; --accent-soft:#16393A;
    --flame:#FF9653; --flame-soft:#3B2415;
    --ok:#56C784; --ok-soft:#173326; --bad:#F2776E; --bad-soft:#3A1D1C; --warn:#F0C062; --warn-soft:#352A12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171F31; --surface-2:#212A40; --ink:#E6EBF5; --muted:#9BA6BF; --line:#2D3750;
  --accent:#43C3B7; --accent-ink:#04201D; --accent-soft:#16393A;
  --flame:#FF9653; --flame-soft:#3B2415;
  --ok:#56C784; --ok-soft:#173326; --bad:#F2776E; --bad-soft:#3A1D1C; --warn:#F0C062; --warn-soft:#352A12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}
.stack{display:grid;gap:14px}
.stack-s{display:grid;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.zh{font-family:var(--f-zh);font-size:16px;color:var(--muted)}
.small{font-size:16px}
.label{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:700;white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.flame{background:var(--flame);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.sm{min-height:44px;padding:0 12px;font-size:16px}
.btn.block{width:100%}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.rec{background:var(--bad);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.navb:focus-visible,.cal button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{min-height:44px;padding:6px 12px;border-radius:12px;border:1px dashed var(--accent);background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;text-align:left;line-height:1.35}
.chip.used{border-style:solid;background:var(--ok-soft);border-color:var(--ok)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
/* hero */
.hero{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.mascot svg{width:100%;height:auto;display:block}
.streak{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;color:var(--flame);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.streak small{font-size:18px;color:var(--muted);font-family:var(--f-body);font-weight:700}
.freeze{display:inline-flex;gap:4px;align-items:center}
.lvbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--flame);border-radius:99px}
.note{padding:12px 14px;border-radius:12px;font-size:17px}
.note.info{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft)}
.note.ok{background:var(--ok-soft)}
/* today card */
.today{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center;font-size:17px}
.steps .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px;font-weight:800;color:var(--muted)}
.steps .done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.ring{width:84px;height:84px}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring text{fill:var(--ink);font-family:var(--f-display);font-weight:800;font-size:22px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{text-align:center;font-size:14px;color:var(--muted);font-weight:700}
.cal button{aspect-ratio:1;max-width:100%;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.cal button.done{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.cal button.frozen{background:var(--accent);color:var(--accent-ink);opacity:.42;border-color:transparent}
.cal button.part{background:var(--accent-soft)}
.cal button.today{outline:3px solid var(--flame);outline-offset:-1px}
.cal button.fut{color:var(--muted);background:transparent}
.cal button.sel{box-shadow:0 0 0 3px var(--ink) inset}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
/* lesson */
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stepper button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper button.cur{border:2px solid var(--accent);color:var(--ink)}
.stepper button.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chunk-en{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.3}
.ex{font-size:18px}
.big-en{font-size:22px;font-weight:700;line-height:1.4}
.timer{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--flame);width:100%;animation:shrink 8s linear forwards}
@keyframes shrink{to{width:0}}
.res{padding:12px 14px;border-radius:12px}
.res.ok{background:var(--ok-soft)}
.res.no{background:var(--warn-soft)}
.rounds{display:flex;gap:6px}
.rounds span{flex:1;height:6px;border-radius:99px;background:var(--surface-2)}
.rounds span.on{background:var(--accent)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:18px;min-width:0;overflow-wrap:anywhere}
.msg.partner{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent-soft);align-self:flex-end;border-bottom-right-radius:4px}
.fix{align-self:flex-end;max-width:88%;font-size:16px;background:var(--warn-soft);border-radius:12px;padding:8px 12px;min-width:0}
.fix s{color:var(--bad)}
.fix b{color:var(--ok)}
.thinking{align-self:flex-start;color:var(--muted);font-style:italic}
.who{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:2px}
/* done */
.celebrate{text-align:center;display:grid;gap:12px;justify-items:center}
.celebrate .mascot{width:150px}
.bump{animation:bump .9s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes bump{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.hop{animation:hop 1s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
/* grids */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border-radius:12px;padding:12px;background:var(--surface-2);font-size:16px;min-width:0}
.badge.got{background:var(--flame-soft)}
.badge.lock{opacity:.55}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.levels div{text-align:center;font-size:13px;color:var(--muted);min-width:0}
.levels div.lock svg{filter:grayscale(1);opacity:.35}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:8px;cursor:pointer;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.match button.sel{border:2px solid var(--accent)}
.match button.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.match button.bad{background:var(--bad-soft)}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.li > div{min-width:0}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.navb{min-height:62px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.navb.act{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:16px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.share{width:100%;font-size:16px;min-height:70px}
@media (max-width:420px){
  .hero{grid-template-columns:96px 1fr;gap:12px}
  .streak{font-size:48px}
  .ring{width:70px;height:70px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
/* v2：錄音中、聽力模糊字卡、連線設定 */
.btn.rec{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(179,57,47,.55)}50%{box-shadow:0 0 0 10px rgba(179,57,47,0)}}
.live{font-size:16px;padding:8px 12px;border-radius:10px;background:var(--bad-soft);color:var(--ink);display:flex;gap:8px;align-items:center}
.live .rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.veil{filter:blur(7px);cursor:pointer;user-select:none;-webkit-user-select:none}
.veil-hint{display:block;font-size:14px;color:var(--muted);font-weight:700}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.conn{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){ .btn.rec,.live .rdot{animation:none!important} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span id="brandBird" aria-hidden="true" style="width:32px;display:inline-block"></span>Daily English Coach</div>
    <div class="row" style="gap:6px">
      <span id="aiPill" class="pill"><span class="dot"></span><span>自評模式</span></span>
      <span id="syncPill" class="pill"><span class="dot"></span><span>本機</span></span>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="主要分頁">
  <div class="nav-in" id="nav"></div>
</nav>
<div id="toast" class="toast" hidden></div>

<!-- ============================================================
     dec-core：純邏輯（不碰 DOM）。打卡、凍結卡、等級、SRS、合併。
     tests/logic.test.mjs 會把這一段原樣抽出來在 node 的 vm 裡跑。
     ============================================================ -->
<script id="dec-core">
var DEC = (function () {
  'use strict';
  // 吉祥物 10 級的累計完成天數門檻（SPEC 第 3 節）
  var LEVELS = [1, 3, 7, 14, 21, 30, 45, 60, 90, 120];
  var FREEZE_EVERY = 7;   // 每連續 7 天得 1 張凍結卡
  var FREEZE_MAX = 2;     // 最多存 2 張
  var STREAK_BADGES = [7, 30, 100, 365];
  var STEPS = ['warm', 'learn', 'practice', 'apply'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  // 裝置本地日期（不用 toISOString，那是 UTC）
  function localDateStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function isDateStr(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  // 日期字串 <-> 天數序號，只用 UTC 運算避免時區與夏令時間干擾
  function dayNum(s) { var p = s.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function fromDayNum(n) {
    var d = new Date(n * 86400000);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function addDays(s, n) { return fromDayNum(dayNum(s) + n); }
  function diffDays(a, b) { return dayNum(b) - dayNum(a); } // b 減 a
  function weekday(s) { return new Date(dayNum(s) * 86400000).getUTCDay(); } // 0=日
  function isWeekend(s) { var w = weekday(s); return w === 0 || w === 6; }
  function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
  function nonNeg(x) { return (typeof x === 'number' && isFinite(x) && x > 0) ? Math.floor(x) : 0; }

  function levelFor(totalDays) {
    var l = 0;
    for (var i = 0; i < LEVELS.length; i++) if (totalDays >= LEVELS[i]) l = i + 1;
    return l;
  }
  function nextLevelInfo(totalDays) {
    var l = levelFor(totalDays);
    if (l >= LEVELS.length) return { level: l, next: null, daysLeft: 0, from: LEVELS[l - 1], to: LEVELS[l - 1] };
    return { level: l, next: l + 1, daysLeft: LEVELS[l] - totalDays, from: l ? LEVELS[l - 1] : 0, to: LEVELS[l] };
  }

  function defaultProfile() {
    return { streak: 0, longest: 0, freezes: 0, lastDone: '', totalDays: 0, level: 0, badges: [],
      settings: { voice: '', speed: 1.0, mode: 'voice' }, updatedAt: '' };
  }
  // 把任何來源（localStorage、db、舊版）讀到的 profile 整理成固定形狀
  function normalizeProfile(p) {
    p = (p && typeof p === 'object') ? p : {};
    var s = (p.settings && typeof p.settings === 'object') ? p.settings : {};
    var out = {
      streak: nonNeg(p.streak), longest: nonNeg(p.longest),
      freezes: Math.min(FREEZE_MAX, nonNeg(p.freezes)),
      lastDone: isDateStr(p.lastDone) ? p.lastDone : '',
      totalDays: nonNeg(p.totalDays), level: 0,
      badges: Array.isArray(p.badges) ? p.badges.filter(function (b) { return typeof b === 'string'; }) : [],
      settings: { voice: typeof s.voice === 'string' ? s.voice : '', speed: s.speed === 0.8 ? 0.8 : 1.0, mode: s.mode === 'text' ? 'text' : 'voice' },
      updatedAt: typeof p.updatedAt === 'string' ? p.updatedAt : ''
    };
    out.longest = Math.max(out.longest, out.streak);
    out.level = levelFor(out.totalDays);
    return out;
  }

  // 首頁用：今天打開時的連續狀態（不改資料）
  //   new     從沒完成過
  //   done    今天已完成
  //   pending 昨天有完成，今天還沒
  //   freeze  漏的天數 ≤ 手上的凍結卡（最多 2 張補 2 天）：今天完成會自動用掉 missed 張
  //   broken  漏的天數比凍結卡多：今天完成從 1 重來
  function streakStatus(p, today) {
    p = normalizeProfile(p);
    if (!p.lastDone) return { state: 'new', effective: 0, missed: 0 };
    var gap = diffDays(p.lastDone, today);
    if (gap <= 0) return { state: 'done', effective: p.streak, missed: 0 };
    if (gap === 1) return { state: 'pending', effective: p.streak, missed: 0 };
    var missed = gap - 1;
    if (missed <= p.freezes) return { state: 'freeze', effective: p.streak, missed: missed };
    return { state: 'broken', effective: 0, missed: missed };
  }

  function addBadge(p, id, list) {
    if (p.badges.indexOf(id) < 0) { p.badges.push(id); if (list) list.push(id); return true; }
    return false;
  }

  // 打卡：完成 Apply 的那一刻呼叫。回傳新 profile 與事件（給完成畫面顯示）。
  function computeCheckIn(profile, today) {
    var p = normalizeProfile(profile);
    var np = clone(p);
    var ev = { already: false, freezeUsed: 0, frozenDates: [], broke: false, earnedFreeze: false,
      levelUp: false, prevLevel: p.level, newBadges: [] };
    if (p.lastDone && diffDays(p.lastDone, today) <= 0) { ev.already = true; return { profile: np, events: ev }; }
    var st = streakStatus(p, today);

  // 找 Gist：gistId → 列表找檔名 → 建私人 gist。回傳 {gist} 或 {created:true}
  async function findGist(local) {
    if (S.cfg.gistId) {
      try { return { gist: await ghFetch('/gists/' + S.cfg.gistId) }; }
      catch (e) { if (e.code !== 'not_found') throw e; S.cfg.gistId = ''; saveCfg(); }
    }
    var list = await ghFetch('/gists?per_page=100');
    var id = DEC.findGistId(list, DEC.GIST_FILE);
    if (id) { S.cfg.gistId = id; saveCfg(); return { gist: await ghFetch('/gists/' + id) }; }
    var files = {}; files[DEC.GIST_FILE] = { content: JSON.stringify(DEC.makeGistFile(local, new Date().toISOString())) };
    var g = await ghFetch('/gists', 'POST', { description: 'Daily English Coach progress (private)', public: false, files: files });
    if (!g || typeof g.id !== 'string') throw ghErr('http', '建立 Gist 失敗，下次再試。');
    S.cfg.gistId = g.id; saveCfg();
    return { created: true };
  }
  // 讀 Gist 裡的檔：沒有這個檔回 null；被截斷就改抓 raw_url；內容壞掉丟錯誤（不覆蓋，以免蓋掉雲端資料）
  async function readRemote(gist) {
    var info = DEC.gistFileInfo(gist, DEC.GIST_FILE);
    if (!info) return null;
    var text = info.content;
    if (info.truncated && info.rawUrl) {
      try {
        var r = await fetch(info.rawUrl, { cache: 'no-store' });
        if (!r.ok) throw new Error('raw');
        text = await r.text();
      } catch (e) { throw ghErr('network', '讀不到雲端進度檔，下次再試。'); }
    }
    if (!text.trim()) return null;
    try { return JSON.parse(text); } catch (e) { throw ghErr('bad_remote', '雲端進度檔格式壞了，這次不同步（本機資料保留）。'); }
  }
  // 同步一次：GET → DEC.mergeProfiles → 寫本機 → 有差才 PATCH。同時間只跑一個，跑完又 dirty 就再跑。
  async function syncNow() {
    if (!S.cfg.githubToken) { setSync('local'); return false; }
    if (Date.now() < SY.pausedUntil) return false;
    if (SY.running) { SY.again = true; return false; }
    SY.running = true; SY.dirty = false; clearTimeout(SY.timer);
    setSync('syncing');
    var ok = false;
    try {
      var found = await findGist({ profile: S.profile, days: S.days, chunks: S.chunks });
      if (!found.created) {
        var raw = await readRemote(found.gist);
        var remote = DEC.normalizeBundle(raw);
        // 合併用「現在」的本機資料（GET 期間的修改也算進來）
        var m = DEC.normalizeBundle(DEC.mergeProfiles({ profile: S.profile, days: S.days, chunks: S.chunks }, remote));
        S.profile = m.profile; S.days = m.days; S.chunks = m.chunks;
        sset(KEY.profile, S.profile); sset(KEY.days, S.days); sset(KEY.chunks, S.chunks);
        if (!raw || !DEC.sameBundle(m, remote)) {
          var files = {}; files[DEC.GIST_FILE] = { content: JSON.stringify(DEC.makeGistFile(m, new Date().toISOString())) };
          await ghFetch('/gists/' + S.cfg.gistId, 'PATCH', { files: files });
        }
      }
      SY.lastSync = Date.now();
      S.conn.github = { state: 'ok', msg: '' };
      setSync('ok');
      ok = true;
    } catch (e) {
      var code = e && e.code, msg = (e && e.msg) || '同步失敗，下次再試。';
      if (code === 'gh_rate') SY.pausedUntil = Date.now() + 10 * 60 * 1000;
      if (code === 'bad_token' || code === 'bad_remote') S.conn.github = { state: 'err', msg: msg };
      setSync('err', msg);
    } finally {
      SY.running = false;
      if (SY.again || SY.dirty) { SY.again = false; markDirty(); }
    }
    if (!S.lesson && !isTyping()) render(); else paintPills();
    return ok;
  }
  // 正在輸入 key 的時候不要重畫（避免游標跳掉）
  function isTyping() { var a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.value); }

  // ---------- AI 家教：Gemini generateContent ----------
  var activeCtl = null;
  function aiErrMsg(code) {
    switch (code) {
      case 'cancelled': return '';
      case 'rate_limited': return '使用次數太多了（Gemini 免費額度），請稍後再試。';
      case 'bad_key': return 'Gemini key 無效，請到「我」重新設定。';
      case 'invalid_json': return 'AI 回覆的格式不對，請按「再試一次」。';
      case 'refused': return 'AI 不回覆這段內容，請換個說法。';
      case 'empty_completion': return 'AI 沒有回覆，請把句子改短一點再送。';
      case 'not_granted': return '還沒設定 Gemini key，請到「我」→〈連線設定〉。';
      default: return '連線不穩，請按「再試一次」。';
    }
  }
  // 底層呼叫：key 只放在 x-goog-api-key header；失敗丟 {code}；絕不自動重試、不做 cache
  async function geminiCall(input, tier, signal) {
    var res;
    try {
      res = await fetch(DEC.geminiUrl(tier, S.cfg.model), {
        method: 'POST', cache: 'no-store', signal: signal,
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.cfg.geminiKey },
        body: JSON.stringify(DEC.geminiRequestBody(input))
      });
    } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error' }; }
    if (!res.ok) {
      var t = ''; try { t = await res.text(); } catch (e) {}
      throw { code: DEC.geminiErrorCode(res.status, t) };
    }
    var j;
    try { j = await res.json(); } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'invalid_json' }; }
    var p = DEC.parseGeminiResponse(j);
    if (!p.ok) throw { code: p.code };
    return p.value;
  }
  // 呼叫方式與 v1 相同：askJSON(input, {modelTier}, job)；錯誤放 job.err = {code, msg}
  async function askJSON(input, opts, job) {
    if (!S.cfg.geminiKey) { job.err = { code: 'not_granted', msg: aiErrMsg('not_granted') }; return null; }
    var ctl = new AbortController();  // 每次呼叫一個新的
    activeCtl = ctl; job.busy = true; job.err = null; render();
    try {
      var v = await geminiCall(input, (opts && opts.modelTier) || 'default', ctl.signal);
      if (S.conn.gemini.state !== 'ok') { S.conn.gemini = { state: 'ok', msg: '' }; paintPills(); }
      return v;
    } catch (e) {
      var code = (e && typeof e.code === 'string') ? e.code : 'upstream_error';
      if (code === 'bad_key') { S.conn.gemini = { state: 'err', msg: aiErrMsg('bad_key') }; paintPills(); } // 不清 key，只亮紅燈
      if (code !== 'cancelled') job.err = { code: code, msg: aiErrMsg(code) };
      return null;
    } finally {
      if (activeCtl === ctl) activeCtl = null;
      job.busy = false;
    }
  }
  // 「我」的測試按鈕
  async function testGemini() {
    if (!S.cfg.geminiKey) { S.conn.gemini = { state: 'none', msg: '' }; render(); return; }
    S.conn.gemini = { state: 'testing', msg: '' }; render();
    try {
      var v = await geminiCall('Reply with only JSON, no other text: {"ok":true}', 'quick', new AbortController().signal);
      S.conn.gemini = v && typeof v === 'object' ? { state: 'ok', msg: '' } : { state: 'err', msg: 'AI 回覆格式不對。' };
    } catch (e) {
      var code = e && e.code;
      S.conn.gemini = { state: 'err', msg: aiErrMsg(code === 'cancelled' ? 'upstream_error' : code) };
    }
    render();
  }
  async function testGithub() {
    if (!S.cfg.githubToken) { S.conn.github = { state: 'none', msg: '' }; setSync('local'); render(); return; }
    S.conn.github = { state: 'testing', msg: '' }; render();
    SY.pausedUntil = 0;
    while (SY.running) await new Promise(function (r) { setTimeout(r, 200); });
    var ok = await syncNow();
    if (!ok && S.conn.github.state === 'testing') S.conn.github = { state: 'err', msg: S.syncMsg || '同步失敗。' };
    render();
  }

  // ---------- 提示詞（輸出一律 JSON，形狀寫死並附一行範例） ----------
  var LEARNER = 'The learner is a Taiwanese RF engineering manager (WiFi, 5G, testing, meetings with vendors and customers), English level CEFR B1-B2, TOEIC 740.';

        NO_JA,

  // ---------- 語音：朗讀（TTS）與辨識 ----------
  // quiet：自動朗讀時用，不支援也不跳提示
  function speak(text, quiet) {
    if (!('speechSynthesis' in window)) { if (!quiet) toast('這個瀏覽器不支援朗讀。'); return; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text).replace(/…/g, ' '));
      u.lang = 'en-US'; u.rate = S.profile.settings.speed || 1;
      var vs = speechSynthesis.getVoices() || [];
      var v = vs.filter(function (x) { return x.name === S.profile.settings.voice; })[0] ||
        vs.filter(function (x) { return /^en[-_]US/i.test(x.lang); })[0];
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { if (!quiet) toast('朗讀失敗。'); }
  }
  // iOS Safari：speechSynthesis 第一次必須在使用者手勢裡呼叫，之後非同步的自動朗讀才會出聲
  var speechWarm = false;
  function warmSpeech() {
    if (speechWarm || !S.cfg.autoSpeak || !('speechSynthesis' in window)) return;
    speechWarm = true;
    try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'en-US'; speechSynthesis.speak(u); } catch (e) {}
  }
  // AI 夥伴的回覆進來：autoSpeak 開著就自動朗讀
  function autoSay(text) { if (S.cfg.autoSpeak && text) speak(text, true); }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  function micOK() { return !!SR && !S.micBlocked && S.profile.settings.mode === 'voice'; }
  var rec = null, recSess = null;
  // 離開畫面時用：直接取消，這次聽到的不填
  function stopMic() {
    if (recSess) recSess.cancelled = true;
    if (rec) { try { rec.abort(); } catch (e) {} }
    rec = null; recSess = null; S.listening = null; S.heard = '';
  }
  function micErrMsg(c) {
    if (c === 'not-allowed') return '瀏覽器沒有麥克風權限。iPhone：設定 → Safari → 麥克風；電腦：網址列左邊的鎖頭。改好後重新整理頁面。';
    if (c === 'service-not-allowed') return '語音辨識服務沒有開。iPhone：設定 → 一般 → 鍵盤 → 開啟「聽寫」；電腦：網址列左邊的鎖頭 → 麥克風允許。';
    if (c === 'audio-capture') return '找不到麥克風，請確認裝置有麥克風且沒有被其他程式占用。';
    if (c === 'no-speech') return '沒有聽到聲音，再試一次。';
    if (c === 'network') return '語音辨識需要網路，請確認連線後再試。';
    return '';
  }
  // key：這次錄音的識別；path：結果填進哪個文字框；compare：跟讀時要比對的英文
  function startMic(key, path, compare) {
    if (!micOK()) return;
    if (rec) {
      var same = S.listening === key;
      if (same) { try { rec.stop(); } catch (e) {} return; } // 再按一次＝停止，已聽到的照樣填入（onend 處理）
      stopMic(); render();
    }
    var sess = { cancelled: false, fin: '', inter: '' };
    var base = path ? String(getPath(path) || '').replace(/\s+$/, '') : '';
    var fill = function (t) {
      if (!path) return;
      var v = base ? base + ' ' + t : t;
      setPath(path, v);
      var el = document.querySelector('[data-bind="' + path + '"]'); if (el) el.value = v;
    };
    try {
      var r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
      r.onresult = function (e) {
        if (sess.cancelled) return;
        var fin = '', inter = '', res = e.results || [];
        for (var i = 0; i < res.length; i++) {
          var x = res[i], t = (x && x[0] && x[0].transcript) || '';
          if (x && x.isFinal) fin += t; else inter += t;
        }
        sess.fin = fin.trim(); sess.inter = inter.trim();
        var live = (sess.fin + ' ' + sess.inter).trim();
        if (!live) return;
        S.heard = live; fill(live);
        var lv = $('micLive'); if (lv) lv.lastChild.textContent = live;
      };
      r.onerror = function (e) {
        var c = e && e.error;
        if (c === 'audio-capture') S.micBlocked = true;
        if (c === 'aborted') return;
        var m = micErrMsg(c);
        if (m) { S.micMsg = (c === 'no-speech') ? '' : m; toast(m, c === 'no-speech' ? 3200 : 9000); }
      };
      r.onend = function () {
        if (rec === r) { rec = null; recSess = null; S.listening = null; }
        if (sess.cancelled) return;
        // iOS Safari 常常只給 interim 不給 final：沒有 final 就用最後一段 interim
        var t = (sess.fin + ' ' + sess.inter).trim() || sess.inter;
        if (t) {
          fill(t); S.micMsg = '';
          if (compare) S.shadow[key] = { heard: t, pct: DEC.wordSimilarity(t, compare) };
        }
        S.heard = '';
        render();
      };
      rec = r; recSess = sess; S.listening = key; S.heard = '';
      r.start(); render();
    } catch (e) { rec = null; recSess = null; S.listening = null; S.micBlocked = true; render(); }
  }

  // ---------- 文字框綁定（避免重繪時掉字） ----------
  function getPath(p) { return p.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, S); }
  function setPath(p, v) {
    var ks = p.split('.'), o = S;
    for (var i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) return; o = o[ks[i]]; }
    o[ks[ks.length - 1]] = v;
  }

  // ---------- toast ----------
  var toastT = null;
  function toast(msg, ms) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, ms || 3200);
  }

  // ---------- 共用小元件 ----------
  function ring(pct, label) {
    var r = 36, c = 2 * Math.PI * r, off = c * (1 - pct);
    return '<svg class="ring" viewBox="0 0 90 90" role="img" aria-label="今日進度 ' + Math.round(pct * 100) + '%">' +
      '<circle class="bgc" cx="45" cy="45" r="' + r + '"/>' +
      '<circle class="fgc" cx="45" cy="45" r="' + r + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 45 45)"/>' +
      '<text x="45" y="53" text-anchor="middle">' + h(label) + '</text></svg>';
  }
  function micBtn(key, path, compare, label) {
    if (!micOK()) return '';
    var on = S.listening === key;
    // 錄音中：紅色脈動按鈕＋「聽你說…」即時字幕（iOS 第一次會先跳系統的麥克風詢問）
    return '<button class="btn sm ' + (on ? 'rec' : '') + '" data-act="mic" data-key="' + h(key) + '" data-path="' + h(path || '') + '" data-compare="' + h(compare || '') + '" aria-pressed="' + on + '">' +
      (on ? I.stop + ' 聽你說…（點我停止）' : I.mic + ' ' + (label || '說說看')) + '</button>' +
      (on ? '<div id="micLive" class="live" role="status" style="flex-basis:100%"><span class="rdot" aria-hidden="true"></span><span>' + h(S.heard || '聽你說…請開口') + '</span></div>' : '');
  }
  function playBtn(text, label) {
    return '<button class="btn sm" data-act="speak" data-text="' + h(text) + '">' + I.play + ' ' + h(label || '播放') + '</button>';
  }
  function aiBusy(job, label) {
    return '<div class="row"><span class="thinking">' + h(label || 'Thinking…') + '</span><button class="btn sm" data-act="stopai">' + I.stop + ' 停止</button></div>';
  }
  function errBox(job, retryAct) {
    if (!job || !job.err || !job.err.msg) return '';
    var retry = retryAct && ['rate_limited', 'bad_key', 'not_granted'].indexOf(job.err.code) < 0 ? '<button class="btn sm" data-act="' + retryAct + '">再試一次</button>' : '';
    return '<div class="note bad row between"><span>' + h(job.err.msg) + '</span>' + retry + '</div>';
  }
  var STEP_LABEL = { warm: '① Warm-up', learn: '② Learn', practice: '③ Practice', apply: '④ Apply' };
  var STEP_ZH = { warm: '複習詞組', learn: '學新詞組', practice: '開口練習', apply: '角色扮演' };

  // ================= 首頁 =================
  function homeMessage(st, t) {
    var p = S.profile, d = S.days[t];
    if (st.state === 'done') {
      var tm = DEC.pickScenario(LIB, DEC.addDays(t, 1), 0);
      return { cls: 'ok', text: '今天完成了！明天預告：' + tm.title + '（' + tm.titleZh + '）' };
    }
    var remain = d ? DEC.STEPS.filter(function (k) { return !d.steps[k]; }) : [];
    var partial = d && remain.length < 4 ? '今日未完成：還剩 ' + remain.map(function (k) { return STEP_LABEL[k]; }).join('、') + '。' : '';
    if (st.state === 'new') return { cls: 'info', text: partial || '第一次來！做完今天這一課，訊號小鳥就會破殼。' };
    if (st.state === 'freeze') return { cls: 'warn', text: '漏了 ' + st.missed + ' 天。今天完成會自動用掉 ' + st.missed + ' 張凍結卡，連續 ' + p.streak + ' 天不中斷。' + (partial ? ' ' + partial : '') };
    if (st.state === 'broken') return { cls: 'bad', text: '連續紀錄中斷了（最長 ' + p.longest + ' 天，紀錄會保留）。今天完成就從第 1 天重新開始。' + (partial ? ' ' + partial : '') };
    return { cls: 'info', text: partial || ('已連續 ' + p.streak + ' 天，今天完成就是第 ' + (p.streak + 1) + ' 天。') };
  }
  function renderHome() {
    var t = today(), p = S.profile, st = DEC.streakStatus(p, t);
    var scn = scenarioFor(t), d = S.days[t];
    var done = d ? DEC.STEPS.filter(function (k) { return d.steps[k]; }).length : 0;
    var lv = DEC.nextLevelInfo(p.totalDays);
    var lvPct = lv.next ? Math.max(4, Math.round(100 * (p.totalDays - lv.from) / Math.max(1, lv.to - lv.from))) : 100;
    var msg = homeMessage(st, t);
    var started = d && d.steps.learn;
    var aiNote = S.aiState === 'off' ? '<div class="note warn small">' + h(S.aiOffMsg) + '</div>' : '';
    var freezeIc = '';
    for (var i = 0; i < DEC.FREEZE_MAX; i++) freezeIc += '<span style="color:' + (i < p.freezes ? 'var(--accent)' : 'var(--line)') + '">' + I.snow + '</span>';
    var o = '';
    o += '<section class="card hero" aria-label="連續天數">' +
      '<div class="mascot">' + birdSVG(p.level) + '</div>' +
      '<div class="stack-s" style="min-width:0">' +
        '<div class="streak"><span style="display:inline-flex">' + I.flame + '</span><span class="num">' + st.effective + '</span><small>天連續</small></div>' +
        '<div class="small">Lv' + p.level + ' ' + h(LEVEL_NAMES[p.level]) + (lv.next ? '，再 <b class="num">' + lv.daysLeft + '</b> 天升級' : '，已滿級') + '</div>' +
        '<div class="lvbar" aria-hidden="true"><i style="width:' + lvPct + '%"></i></div>' +
        '<div class="row small muted" style="gap:6px"><span class="freeze" aria-label="凍結卡 ' + p.freezes + ' 張">' + freezeIc + '</span>凍結卡 ' + p.freezes + '/2 · 最長 ' + p.longest + ' 天</div>' +
      '</div></section>';
    o += '<div class="note ' + msg.cls + '">' + h(msg.text) + '</div>';
    o += aiNote;
    // 今日任務卡
    var tag = scn.type === 'custom' ? '自訂情境' : (scn.type === 'work' ? '職場' : '日常');
    o += '<section class="card stack" aria-label="今日任務">' +
      '<div class="today"><div class="stack-s" style="min-width:0">' +
        '<div class="row" style="gap:8px"><span class="label">今日任務 · ' + h(t) + '</span><span class="tag">' + tag + '</span></div>' +
        '<h1>' + h(scn.title) + '</h1><div class="zh">' + h(scn.titleZh) + ' · 約 10 分鐘</div></div>' +
        ring(done / 4, done + '/4') + '</div>' +
      '<ul class="steps">' + DEC.STEPS.map(function (k) {
        var ok = d && d.steps[k];
        return '<li class="' + (ok ? 'done' : '') + '"><span class="ck">' + (ok ? I.check : '') + '</span><span><b>' + STEP_LABEL[k] + '</b> <span class="zh">' + STEP_ZH[k] + '</span></span></li>';
      }).join('') + '</ul>' +
      '<button class="btn primary block" data-act="startLesson">' + (st.state === 'done' ? '再練一次今天的課' : done ? '繼續今天的課' : '開始今天的課') + '</button>' +
      '<div class="row">' +
        '<button class="btn sm" data-act="swap" ' + (started ? 'disabled' : '') + '>換一個情境</button>' +
        '<button class="btn sm" data-act="toggleCustom" ' + (started ? 'disabled' : '') + '>自訂情境</button>' +
        (started ? '<span class="small muted">今天已開始，明天再換</span>' : '') +
      '</div>' + renderCustomBox() + '</section>';
    o += renderCalendar(t);
    return o;
  }
  function renderCustomBox() {
    if (!S.showCustom) return '';
    if (S.aiState !== 'on') return '<div class="note warn small">自訂情境需要 AI 家教，請到「我」→〈連線設定〉貼上 Gemini key。</div>';
    var j = S.customJob;
    return '<div class="card flat stack-s">' +
      '<label class="small" for="customText">用一句話描述你接下來要面對的場合（中英文都可以）</label>' +
      '<textarea id="customText" data-bind="customText" placeholder="例如：明天要跟原廠報告 WiFi 7 漫遊測試結果">' + h(S.customText) + '</textarea>' +
      (j.busy ? aiBusy(j, '正在幫你編課程…（約 10–60 秒）') : '<button class="btn primary" data-act="makeCustom">產生今天的課</button>') +
      errBox(j, 'makeCustom') + '</div>';
  }
  function renderCalendar(t) {
    var base = t.split('-').map(Number);
    var y = base[0], m = base[1] - 1 + S.calOffset;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    var first = y + '-' + String(m + 1).padStart(2, '0') + '-01';
    var startW = DEC.weekday(first);
    var nDays = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    var o = '<section class="card stack" aria-label="月曆"><div class="row between"><h2>' + y + ' 年 ' + (m + 1) + ' 月</h2><div class="row" style="gap:6px">' +
      '<button class="btn sm" data-act="calPrev" aria-label="上個月">‹</button><button class="btn sm" data-act="calNext" aria-label="下個月" ' + (S.calOffset >= 0 ? 'disabled' : '') + '>›</button></div></div>';
    o += '<div class="cal">' + ['日', '一', '二', '三', '四', '五', '六'].map(function (w) { return '<div class="wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < startW; i++) o += '<div></div>';
    for (var dd = 1; dd <= nDays; dd++) {
      var ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
      var rec = S.days[ds], cls = [];
      if (rec && rec.steps.apply) cls.push('done');
      else if (rec && rec.frozen) cls.push('frozen');
      else if (rec && DEC.STEPS.some(function (k) { return rec.steps[k]; })) cls.push('part');
      if (ds === t) cls.push('today');
      if (ds > t) cls.push('fut');
      if (ds === S.calSel) cls.push('sel');
      o += '<button class="' + cls.join(' ') + '" data-act="calDay" data-date="' + ds + '" aria-label="' + ds + '">' + dd + '</button>';
    }
    o += '</div><div class="legend"><span><i style="background:var(--accent)"></i>完成</span><span><i style="background:var(--accent);opacity:.42"></i>凍結卡補上</span><span><i style="background:var(--accent-soft)"></i>做一半</span><span><i style="outline:3px solid var(--flame);outline-offset:-3px"></i>今天</span></div>';
    if (S.calSel) {
      var r = S.days[S.calSel];
      if (!r) o += '<div class="note info small">' + h(S.calSel) + '：這天沒有紀錄。</div>';
      else if (r.frozen) o += '<div class="note info small">' + h(S.calSel) + '：用凍結卡補上，連續天數沒有中斷。</div>';
      else {
        var sc = r.custom || scnById(r.scenarioId);
        var title = r.title || (sc ? sc.title + '（' + sc.titleZh + '）' : '自訂情境');
        var steps = DEC.STEPS.filter(function (k) { return r.steps[k]; }).map(function (k) { return STEP_LABEL[k]; }).join('、') || '尚未完成任何步驟';
        o += '<div class="card flat stack-s small"><b>' + h(S.calSel) + ' · ' + h(title) + '</b><span>完成：' + h(steps) + '</span>' +
          (r.score ? '<span>分數：' + r.score + ' / 5' + (r.minutes ? ' · 約 ' + r.minutes + ' 分鐘' : '') + '</span>' : '') +
          (r.summary ? '<span class="muted" style="white-space:pre-line">' + h(r.summary) + '</span>' : '') + '</div>';
      }
    }
    return o + '</section>';
  }

  // ================= 課程 =================
  function openLesson() {
    var t = today(), scn = scenarioFor(t), d = ensureDay(t);
    if (!d.scenarioId) d.scenarioId = scn.id;
    var first = DEC.STEPS.filter(function (k) { return !d.steps[k]; })[0] || 'warm';
    S.lesson = {
      date: t, scn: scn, step: first, startedAt: Date.now(),
      warm: { ids: DEC.pickDue(S.chunks, t, 3), i: 0, shown: false },
      practice: { i: 0, round: 1, answer: '', result: null, r3: '', r3res: null, busy: false, err: null, oks: 0 },
      apply: newApply(scn)
    };
    S.view = 'lesson'; S.tab = 'today';
  }
  function newApply(scn) {
    return { msgs: [{ who: 'partner', text: scn.roleplay.opening }], turns: [], input: '', count: 0, line: 0,
      suggestions: [], done: false, busy: false, err: null, summary: null, sumJob: { busy: false, err: null }, selfScore: 3, mode: null, started: false };
  }
  function markStep(step) {
    var L = S.lesson, d = ensureDay(L.date);
    if (!d.steps[step]) { d.steps[step] = true; saveDay(L.date); }
  }
  function nextStep() {
    var L = S.lesson, d = S.days[L.date];
    var order = DEC.STEPS, idx = order.indexOf(L.step);
    var rest = order.slice(idx + 1).concat(order.slice(0, idx)).filter(function (k) { return !d.steps[k]; });
    L.step = rest[0] || 'apply';
    window.scrollTo(0, 0);
  }
  function renderLesson() {
    var L = S.lesson, d = S.days[L.date] || DEC.newDay(L.scn.id);
    var o = '<div class="row between"><button class="btn ghost sm" data-act="home">' + I.back + ' 首頁</button><span class="small muted">' + h(L.scn.title) + '</span></div>';
    o += '<nav class="stepper" aria-label="課程步驟">' + DEC.STEPS.map(function (k) {
      var cls = (L.step === k ? 'cur ' : '') + (d.steps[k] ? 'done' : '');
      return '<button class="' + cls + '" data-act="goStep" data-step="' + k + '" aria-current="' + (L.step === k ? 'step' : 'false') + '">' + STEP_LABEL[k] + '<br><span style="font-weight:400">' + (d.steps[k] ? '完成' : STEP_ZH[k]) + '</span></button>';
    }).join('') + '</nav>';
    if (L.step === 'warm') o += renderWarm();
    else if (L.step === 'learn') o += renderLearn();
    else if (L.step === 'practice') o += renderPractice();
    else o += renderApply();
    return o;
  }

  // ① Warm-up：到期詞組 3 張
  function renderWarm() {
    var w = S.lesson.warm;
    if (!w.ids.length) {
      return '<section class="card stack"><h2>① Warm-up</h2><p>今天沒有到期要複習的詞組。完成今天的課之後，詞組會進複習庫，明天開始在這裡出現。</p>' +
        '<button class="btn primary" data-act="warmSkip">跳過，開始學新詞組</button></section>';
    }
    if (w.i >= w.ids.length) {
      return '<section class="card stack"><h2>① Warm-up 完成</h2><p>複習了 ' + w.ids.length + ' 個詞組，下次出現的時間已經依你的答對狀況調整。</p><button class="btn primary" data-act="next">下一步：學新詞組</button></section>';
    }
    var c = S.chunks[w.ids[w.i]];
    var o = '<section class="card stack"><div class="row between"><h2>① Warm-up</h2><span class="small muted num">' + (w.i + 1) + ' / ' + w.ids.length + '</span></div>' +
      '<p class="zh" style="font-size:18px;color:var(--ink)">' + h(c.zh) + '</p><p class="small muted">先在心裡（或開口）說出英文，再看答案。</p>';
    if (!w.shown) o += '<button class="btn primary" data-act="warmShow">看答案</button>';
    else o += '<div class="card flat stack-s"><div class="chunk-en">' + h(c.en) + '</div><div class="ex">' + h(c.ex) + '</div><div class="row">' + playBtn(c.ex) + '</div></div>' +
      '<div class="row"><button class="btn primary" data-act="warmGrade" data-ok="1">' + I.check + ' 記得</button><button class="btn" data-act="warmGrade" data-ok="0">' + I.x + ' 忘了</button></div>';
    return o + '</section>';
  }
  // ② Learn：4 個 chunks
  function renderLearn() {
    var scn = S.lesson.scn;
    var o = '<section class="stack"><div class="card stack-s"><h2>② Learn</h2><p class="small muted">聽兩次、跟著唸一次。點星號可以先收進複習庫（完成今天的課也會自動收進去）。</p></div>';
    scn.chunks.forEach(function (c, i) {
      var id = chunkId(scn, i), saved = !!S.chunks[id], key = 'learn-' + i, sh = S.shadow[key];
      o += '<article class="card stack-s"><div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><div class="chunk-en">' + h(c.en) + '</div><div class="zh">' + h(c.zh) + '</div></div>' +
        '<button class="btn sm ghost" data-act="star" data-i="' + i + '" aria-pressed="' + saved + '" aria-label="收藏">' + (saved ? I.starOn : I.star) + '</button></div>' +
        '<div class="ex">' + h(c.ex) + '</div>' +
        '<div class="row">' + playBtn(c.en, '詞組') + playBtn(c.ex, '例句') + micBtn(key, '', c.ex, '跟讀例句') + '</div>' +
        (sh ? '<div class="res ' + (sh.pct >= 70 ? 'ok' : 'no') + ' small">聽到：「' + h(sh.heard) + '」· 相似度 <b class="num">' + sh.pct + '%</b></div>' : '') +
        '</article>';
    });
    o += '<button class="btn primary block" data-act="learnDone">我學好了，下一步：開口練習</button></section>';
    return o;
  }
  // ③ Practice：每題三輪（快答 → 跟讀自然說法 → 默寫正確句子）
  function renderPractice() {
    var L = S.lesson, p = L.practice, drills = L.scn.drills;
    if (p.i >= drills.length) {
      return '<section class="card stack"><h2>③ Practice 完成</h2><p>' + drills.length + ' 題裡第一輪就說對 <b class="num">' + p.oks + '</b> 題。</p><button class="btn primary" data-act="next">下一步：角色扮演</button></section>';
    }
    var d = drills[p.i], ai = S.aiState === 'on';
    var o = '<section class="card stack"><div class="row between"><h2>③ Practice</h2><span class="small muted num">第 ' + (p.i + 1) + ' / ' + drills.length + ' 題</span></div>' +
      '<div class="rounds" aria-label="第 ' + p.round + ' 輪"><span class="on"></span><span class="' + (p.round >= 2 ? 'on' : '') + '"></span><span class="' + (p.round >= 3 ? 'on' : '') + '"></span></div>';
    var ref = (p.result && p.result.better) || d.en;
    if (p.round === 1) {
      o += '<div class="label">第 1 輪 · 流暢：看中文，馬上說</div><p style="font-size:20px;font-family:var(--f-zh)">' + h(d.zh) + '</p><p class="small muted">提示：' + h(d.hint) + '</p>';
      if (!p.result) {
        o += '<div class="timer" aria-hidden="true"><i></i></div>' +
          '<textarea id="pAns" data-bind="lesson.practice.answer" placeholder="Say it or type it in English…">' + h(p.answer) + '</textarea>' +
          '<div class="row">' + micBtn('p-ans', 'lesson.practice.answer', '', '說說看') + '</div>';
        if (p.busy) o += aiBusy(p, 'AI 家教在看你的句子…');
        else if (ai) o += '<div class="row"><button class="btn primary" data-act="pSubmit">送出</button><button class="btn ghost sm" data-act="pReveal">直接看參考答案</button></div>';
        else o += '<div class="row"><button class="btn primary" data-act="pReveal">看參考答案（自評）</button></div>';
        o += errBox(p, 'pSubmit');
      } else {
        var r = p.result;
        if (r.self && r.ok === null) {
          o += '<div class="card flat stack-s"><div class="label">參考答案</div><div class="big-en">' + h(d.en) + '</div>' + (p.answer ? '<div class="small muted">你說的：' + h(p.answer) + '</div>' : '') + '</div>' +
            '<div class="row"><button class="btn primary" data-act="pSelf" data-ok="1">' + I.check + ' 我說對了</button><button class="btn" data-act="pSelf" data-ok="0">' + I.x + ' 差一點</button></div>';
        } else {
          o += '<div class="res ' + (r.ok ? 'ok' : 'no') + ' stack-s"><b>' + (r.ok ? '可以接受！' : '意思還差一點') + '</b>' +
            (p.answer ? '<span class="small">你說的：' + h(p.answer) + '</span>' : '') +
            '<span>更自然的說法：<b>' + h(r.better || d.en) + '</b></span>' + (r.note_zh ? '<span class="small">為什麼：' + h(r.note_zh) + '</span>' : '') + '</div>' +
            '<div class="row"><button class="btn primary" data-act="pRound" data-r="2">下一輪：跟讀</button><button class="btn ghost sm" data-act="pNextDrill">跳到下一題</button></div>';
        }
      }
    } else if (p.round === 2) {
      var key = 'p-shadow-' + p.i, sh = S.shadow[key];
      o += '<div class="label">第 2 輪 · 自然：聽一次，跟著唸</div><div class="big-en">' + h(ref) + '</div>' +
        '<div class="row">' + playBtn(ref) + micBtn(key, '', ref, '跟讀') + '</div>' +
        (sh ? '<div class="res ' + (sh.pct >= 70 ? 'ok' : 'no') + ' small">聽到：「' + h(sh.heard) + '」· 相似度 <b class="num">' + sh.pct + '%</b></div>' : '') +
        '<div class="row"><button class="btn primary" data-act="pRound" data-r="3">下一輪：默寫</button><button class="btn ghost sm" data-act="pNextDrill">跳到下一題</button></div>';
    } else {
      o += '<div class="label">第 3 輪 · 正確：不看答案，完整說／寫一次</div><p style="font-size:20px;font-family:var(--f-zh)">' + h(d.zh) + '</p>' +
        '<textarea id="pR3" data-bind="lesson.practice.r3" placeholder="Type the full sentence…">' + h(p.r3) + '</textarea>' +
        '<div class="row">' + micBtn('p-r3', 'lesson.practice.r3', '', '說說看') + '</div>';
      if (!p.r3res) o += '<button class="btn primary" data-act="pCheck3">對答案</button>';
      else o += '<div class="res ' + (p.r3res >= 80 ? 'ok' : 'no') + ' stack-s"><span>和目標句的相似度 <b class="num">' + p.r3res + '%</b>' + (p.r3res >= 80 ? '，很接近了！' : '，再看一次：') + '</span><b>' + h(ref) + '</b></div>' +
        '<button class="btn primary" data-act="pNextDrill">' + (p.i + 1 < drills.length ? '下一題' : '完成 Practice') + '</button>';
    }
    return o + '</section>';
  }
  // ④ Apply：角色扮演
  function renderApply() {
    var L = S.lesson, a = L.apply, scn = L.scn, rp = scn.roleplay;
    var ai = S.aiState === 'on';
    if (!a.mode) a.mode = ai ? 'ai' : 'self';
    if (a.mode === 'ai' && !ai && !a.done) a.mode = 'self';
    var o = '<section class="card stack-s"><h2>④ Apply</h2><p class="small">對象：' + h(rp.partner) + '</p>' +
      '<div class="small"><b>目標：</b>' + rp.goals.map(h).join(' → ') + '</div>' +
      '<div class="row" style="gap:6px">' + scn.chunks.map(function (c) {
        var used = a.msgs.some(function (m) { return m.who === 'me' && DEC.chunkUsed(m.text, c.en); });
        return '<button class="chip ' + (used ? 'used' : '') + '" data-act="insert" data-text="' + h(c.en.replace(/…/g, ' ').trim()) + '">' + (used ? '✓ ' : '') + h(c.en) + '</button>';
      }).join('') + '</div>' +
      (a.mode === 'self' ? '<div class="note warn small">自評模式：對方的台詞是固定腳本，沒有即時修正。回完 ' + (rp.followups.length + 1) + ' 句後自己打分數就能打卡。</div>' : '<p class="small muted">AI 會在每一輪指出你上一句可以更自然的地方。大約 6 輪結束。</p>') +
      '</section>';
    // AI 模式先按「開始對話」：在這個手勢裡暖機 iOS 的朗讀，並朗讀對方的開場白
    if (a.mode === 'ai' && !a.started) {
      return o + '<section class="card stack"><p>' + h(partnerName(rp.partner)) + ' 會先開口。' + (S.cfg.autoSpeak ? '對方的每一句都會自動朗讀，請打開聲音。' : '') + (S.cfg.listenFirst ? '先聽模式開著：文字會先模糊，聽懂了再點開。' : '') + '</p>' +

      else {
        o += '<div class="msg me">' + h(m.text) + '</div>';

      }
    });
    if (a.busy) o += aiBusy(a, partnerName(rp.partner) + ' is thinking…');
    o += '</section>';
    o += errBox(a, 'aRetry');
    var finished = a.mode === 'self' ? a.line >= rp.followups.length + 1 : a.done;
    if (!finished) {
      if (a.suggestions.length) o += '<div class="stack-s"><span class="small muted">可以這樣回（點一下填入）：</span>' + a.suggestions.map(function (s) { return '<button class="chip" data-act="insert" data-replace="1" data-text="' + h(s) + '">' + h(s) + '</button>'; }).join('') + '</div>';
      o += '<div class="stack-s"><textarea id="aIn" data-bind="lesson.apply.input" data-enter="aSend" placeholder="Type your reply… (Enter 送出，Shift+Enter 換行)" ' + (a.busy ? 'disabled' : '') + '>' + h(a.input) + '</textarea>' +
        '<div class="row">' + micBtn('a-in', 'lesson.apply.input', '', '用說的') + '<button class="btn primary" data-act="aSend" ' + (a.busy ? 'disabled' : '') + '>送出</button>' +
        (a.mode === 'ai' && a.count >= 3 && !a.busy ? '<button class="btn ghost sm" data-act="aEnd">結束對話</button>' : '') + '</div></div>';
    } else if (a.mode === 'self') {
      o += '<section class="card stack"><h3>自評</h3><p class="small">上面綠色的詞組是你有用到的。給今天的對話打個分數：</p><div class="row">' +
        [1, 2, 3, 4, 5].map(function (n) { return '<button class="btn sm ' + (a.selfScore === n ? 'on' : '') + '" data-act="selfScore" data-n="' + n + '" aria-pressed="' + (a.selfScore === n) + '">' + n + '</button>'; }).join('') +
        '</div><button class="btn flame block" data-act="finish">完成今天的課並打卡</button></section>';
    } else {
      if (!a.summary) {
        o += '<section class="card stack"><h3>對話結束</h3>' + (a.sumJob.busy ? aiBusy(a.sumJob, '正在整理今天的回饋…') :
          '<button class="btn primary" data-act="aSummary">看總結回饋</button><button class="btn ghost sm" data-act="finish">略過總結，直接打卡</button>') + errBox(a.sumJob, 'aSummary') + '</section>';
      } else {
        var s = a.summary;
        o += '<section class="card stack"><h3>總結回饋 · <span class="num">' + s.score + '</span> / 5</h3>' +
          '<div class="stack-s"><b>做得好</b>' + s.good.map(function (x) { return '<div class="res ok small">' + h(x) + '</div>'; }).join('') + '</div>' +
          '<div class="stack-s"><b>要改進</b>' + s.improve.map(function (x) { return '<div class="res no small">' + h(x) + '</div>'; }).join('') + '</div>' +
          (s.chunks_used.length ? '<div class="small muted">用到的詞組：' + s.chunks_used.map(h).join('、') + '</div>' : '') +
          '<button class="btn flame block" data-act="finish">完成今天的課並打卡</button></section>';
      }
    }
    return o;

  // 對方的一句話：listenFirst 開著時先模糊（點文字顯示），旁邊一直有重播鍵
  function partnerMsg(m, name, src, idx) {
    var body = m.veil ? '<span class="veil" data-act="unveil" data-src="' + src + '" data-i="' + idx + '" role="button" tabindex="0" aria-label="點一下顯示文字">' + h(m.text) + '</span><span class="veil-hint">先聽，聽懂了再點文字顯示</span>' : h(m.text);
    return '<div class="msg partner"><div class="who">' + h(name) + '</div>' + body + ' <button class="btn ghost sm" style="min-height:36px;padding:0 6px;vertical-align:middle" data-act="speak" data-text="' + h(m.text) + '" aria-label="重播">' + I.play + '</button></div>';
  }
  function partnerName(p) { var m = /\(([^)]+)\)/.exec(p); return m ? m[1] : 'Partner'; }

  // ---- Practice 動作 ----
  async function practiceSubmit() {
    var p = S.lesson.practice, d = S.lesson.scn.drills[p.i];
    var ans = (p.answer || '').trim();
    if (!ans) { toast('先說或打一句英文。'); return; }
    var r = await askJSON(PROMPTS.judge(d, ans), { modelTier: 'quick', cache: false }, p);
    if (r != null) {
      var v = DEC.validateJudge(r);
      if (!v) p.err = { code: 'invalid_json', msg: aiErrMsg('invalid_json') };
      else { p.result = v; if (v.ok) p.oks++; }
    }
    render();
  }
  function practiceNextDrill() {
    var p = S.lesson.practice;
    p.i++; p.round = 1; p.answer = ''; p.result = null; p.r3 = ''; p.r3res = null; p.err = null;
    if (p.i >= S.lesson.scn.drills.length) markStep('practice');
  }

  // ---- Apply 動作 ----
  async function applySend(retry) {
    var L = S.lesson, a = L.apply, rp = L.scn.roleplay;
    if (a.busy) return;
    if (!retry) {
      var text = (a.input || '').trim();
      if (!text) { toast('先輸入一句回覆。'); return; }
      a.input = ''; a.suggestions = [];
      a.msgs.push({ who: 'me', text: text });
      if (a.mode === 'self') {
        a.line++;
        if (a.line <= rp.followups.length) a.msgs.push({ who: 'partner', text: rp.followups[a.line - 1] });
        render(); focusSoon('aIn'); return;
      }
      a.count++;
      a.turns.push({ role: 'user', content: '[Learner message ' + a.count + '/6] ' + text });
    }
    // 最前面固定放規則；對話太長只保留最近 14 個 turn
    var recent = a.turns.slice(-14);
    var input = [{ role: 'user', content: PROMPTS.roleplay(L.scn) }].concat(recent);
    var r = await askJSON(input, { modelTier: 'default', cache: false }, a);
    if (S.lesson !== L) return;
    if (r != null) {
      var lastMe = ''; for (var k = a.msgs.length - 1; k >= 0; k--) if (a.msgs[k].who === 'me') { lastMe = a.msgs[k].text; break; }
      var v = DEC.validateTurn(r, lastMe);
      if (!v) a.err = { code: 'invalid_json', msg: aiErrMsg('invalid_json') };
      else {
        for (var i = a.msgs.length - 1; i >= 0; i--) if (a.msgs[i].who === 'me') { a.msgs[i].correction = v.correction; break; }
        a.msgs.push({ who: 'partner', text: v.reply, veil: S.cfg.listenFirst });
        autoSay(v.reply);
        a.turns.push({ role: 'assistant', content: JSON.stringify(v) });
        a.suggestions = v.suggestions;
        if (v.done || a.count >= 6) a.done = true;
      }
    } else if (a.mode === 'ai' && S.aiState === 'off') {
      a.mode = 'self'; a.line = Math.min(a.count, L.scn.roleplay.followups.length);
    }
    render(); focusSoon('aIn');
  }
  function transcriptOf(a, rp) {
    return a.msgs.map(function (m) { return (m.who === 'me' ? 'Learner: ' : partnerName(rp.partner) + ': ') + m.text; }).join('\n').slice(-6000);
  }
  async function applySummary() {
    var L = S.lesson, a = L.apply;
    var r = await askJSON(PROMPTS.summary(L.scn, transcriptOf(a, L.scn.roleplay)), { modelTier: 'default', cache: false }, a.sumJob);
    if (r != null) {
      var v = DEC.validateSummary(r);
      if (!v) a.sumJob.err = { code: 'invalid_json', msg: aiErrMsg('invalid_json') }; else a.summary = v;
    }
    render();
  }

  // ---- 打卡 ----
  function finishLesson() {
    var L = S.lesson, t = L.date, a = L.apply, scn = L.scn;
    var d = ensureDay(t);
    var newly = !d.steps.apply;
    d.steps.apply = true;
    d.frozen = false;
    if (!d.scenarioId) d.scenarioId = scn.id;
    d.title = scn.title + '（' + scn.titleZh + '）';
    var score = a.summary ? a.summary.score : (a.mode === 'self' ? a.selfScore : 3);
    d.score = Math.max(d.score, score);
    d.minutes = Math.max(d.minutes, Math.min(60, Math.max(1, Math.round((Date.now() - L.startedAt) / 60000))));
    if (a.summary) d.summary = '做得好：' + a.summary.good.join('；') + '\n要改進：' + a.summary.improve.join('；');
    else if (!d.summary) d.summary = a.mode === 'self' ? '自評模式完成' : '';
    // 把今天的 4 個 chunks 收進複習庫（明天 Warm-up 會出現）
    var added = [];
    scn.chunks.forEach(function (c, i) {
      var id = chunkId(scn, i);
      if (!S.chunks[id]) { S.chunks[id] = DEC.newChunk(c, scn.id, t); added.push(id); }
    });
    var r = DEC.computeCheckIn(S.profile, t);
    S.profile = r.profile;
    r.events.frozenDates.forEach(function (fd) {
      if (!S.days[fd] || !S.days[fd].steps.apply) { var fdDay = DEC.newDay(''); fdDay.frozen = true; S.days[fd] = fdDay; saveDay(fd); }
    });
    var lb = DEC.libraryBadges(S.profile, Object.keys(S.chunks).length);
    S.profile = lb.profile; r.events.newBadges = r.events.newBadges.concat(lb.newBadges);
    saveDay(t);
    added.forEach(saveChunk);
    if (!r.events.already || lb.newBadges.length) saveProfile();
    S.lastDone = { events: r.events, scn: scn, score: score, summary: a.summary, newly: newly };
    S.lesson = null; S.view = 'done';
    window.scrollTo(0, 0);
  }

  // ================= 複習庫 =================
  function renderReview() {

    var t = today(), due = ids.filter(function (id) { return S.chunks[id].srs.due <= t; }).length;

      '<div class="row"><button class="btn ' + (r.mode === 'match' ? 'on' : '') + '" data-act="revMatch" ' + (ids.length < 4 ? 'disabled' : '') + '>配對練習</button>' +

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function newMatch() {
    var t = today(), ids = Object.keys(S.chunks);
    var dueFirst = DEC.pickDue(S.chunks, t, 4);
    var pick = dueFirst.concat(shuffle(ids.filter(function (x) { return dueFirst.indexOf(x) < 0; }))).slice(0, 4);
    return { ids: pick, en: shuffle(pick), zh: shuffle(pick), selEn: null, ok: [], wrong: null, miss: {} };
  }

    var r = await askJSON(input, { modelTier: 'default', cache: false }, T);
    if (r != null) {
      var lastMe = ''; for (var k = T.msgs.length - 1; k >= 0; k--) if (T.msgs[k].who === 'me') { lastMe = T.msgs[k].text; break; }
      var v = DEC.validateTurn(r, lastMe);

      else {
        for (var i = T.msgs.length - 1; i >= 0; i--) if (T.msgs[i].who === 'me') { T.msgs[i].correction = v.correction; break; }
        T.msgs.push({ who: 'partner', text: v.reply, veil: S.cfg.listenFirst });
        autoSay(v.reply);
        T.turns.push({ role: 'assistant', content: JSON.stringify(v) });
        T.suggestions = v.suggestions;
        if (DEC.addBadge(S.profile, 'talk1')) { saveProfile(); toast('獲得徽章：第一次 Free Talk'); }
      }
    }
    render(); focusSoon('tIn');
  }

      mem = {};
      S.profile = DEC.normalizeProfile(null); S.days = {}; S.chunks = {}; S.confirmReset = false; S.lastDone = null; S.view = 'home';
      toast('這台裝置的資料已清除。');
    }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACT[el.dataset.act];
    if (!fn) return;
    var r = fn(el, e);
    if (r !== false && !(r && typeof r.then === 'function')) render();
  });
  document.addEventListener('input', function (e) {
    var b = e.target.dataset && e.target.dataset.bind;
    if (b) setPath(b, e.target.value);
  });
  document.addEventListener('change', function (e) {
    if (e.target.dataset && e.target.dataset.actChange === 'setModel') { S.cfg.model = DEC.normalizeCfg({ model: e.target.value }).model; saveCfg(); return; }
    if (e.target.dataset && e.target.dataset.actChange === 'setVoice') { S.profile.settings.voice = e.target.value; saveProfile(); speak('Hello, this is my voice.'); }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && t.dataset && t.dataset.enter) {
      e.preventDefault(); var fn = ACT[t.dataset.enter]; if (fn) fn(t, e);
    }
  });
  if ('speechSynthesis' in window) { try { speechSynthesis.onvoiceschanged = function () { if (S.tab === 'me') render(); }; } catch (e) {} }
  // 跨過午夜回到頁面時重畫首頁（日期換了）
  var lastDay = today();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (today() !== lastDay) { lastDay = today(); if (S.view !== 'lesson') { S.view = 'home'; render(); } }
      // 回到前景：距上次同步超過 60 秒就再同步一次（另一台裝置可能剛做完）
      if (S.cfg.githubToken && Date.now() - SY.lastSync > 60000) syncNow();
    } else if (SY.dirty) {
      syncNow(); // 要切走了，還沒寫上去的先送出
    }
  });

  // 先畫首頁，再（有 token 時）同步一次
  refreshAiState();
  render();
  if (S.cfg.githubToken) syncNow();
})();
</script>

</body>
</html>
